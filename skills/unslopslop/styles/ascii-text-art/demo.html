<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASCII text art: dependency-free demo</title>
<style>
  :root { --ground: #15171c; --ink: #e8e3d6; --signal: #f2c14e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font: 16px/1.6 ui-sans-serif, system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 48px 24px; display: grid; gap: 24px; }
  h1 { margin: 0; font: 500 44px/1.1 ui-sans-serif, system-ui, sans-serif; letter-spacing: -.01em; }
  p { margin: 0; max-width: 60ch; color: #b7b2a6; }
  canvas { width: 100%; height: auto; display: block; border-radius: 8px; background: var(--ground); }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; padding: 10px 14px; border-radius: 8px; border: 1px solid #3a3d45; background: none; color: var(--ink); cursor: pointer; }
  button[aria-pressed=true] { border-color: var(--signal); color: var(--signal); }
  button:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <h1>Character halftone</h1>
  <p>A generated shape drawn into a small grid, turned into glyphs by luminance, and painted into one canvas. Reduced motion shows a still frame.</p>
  <div class="controls" role="group" aria-label="Character set">
    <button type="button" data-set=" .:-=+*#%@" aria-pressed="true">Classic</button>
    <button type="button" data-set=" ░▒▓█">Blocks</button>
    <button type="button" data-set=" 01">Binary</button>
  </div>
  <canvas id="out" width="1040" height="585" role="img" aria-label="Animated sphere of light drawn with text characters"></canvas>
</main>
<script>
(() => {
  const COLS = 80, ROWS = 45, out = document.getElementById('out'), o = out.getContext('2d');
  const src = document.createElement('canvas'); src.width = COLS; src.height = ROWS;
  const s = src.getContext('2d', { willReadFrequently: true });
  let ramp = ' .:-=+*#%@';
  const bayer = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16 - 0.5);
  // source: a lit sphere and a ring, as a pure function of time
  function source(t) {
    s.fillStyle = '#000'; s.fillRect(0, 0, COLS, ROWS);
    const cx = COLS / 2 + Math.sin(t / 1400) * 10, cy = ROWS / 2, r = 15;
    const g = s.createRadialGradient(cx - 5, cy - 6, 1, cx, cy, r * 1.9);
    g.addColorStop(0, '#fff'); g.addColorStop(0.45, '#777'); g.addColorStop(1, '#000');
    s.fillStyle = g; s.beginPath(); s.ellipse(cx, cy, r * 2, r, 0, 0, Math.PI * 2); s.fill();
    s.strokeStyle = 'rgba(255,255,255,.55)'; s.lineWidth = 1.2;
    s.beginPath(); s.ellipse(COLS / 2, cy + 2, 34, 6 + 3 * Math.sin(t / 900), 0, 0, Math.PI * 2); s.stroke();
  }
  function render(t) {
    source(t);
    const d = s.getImageData(0, 0, COLS, ROWS).data;
    const cw = out.width / COLS, ch = out.height / ROWS;
    o.fillStyle = '#15171c'; o.fillRect(0, 0, out.width, out.height);
    o.font = `${Math.floor(ch * 0.95)}px ui-monospace, monospace`; o.textBaseline = 'top';
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      const i = (y * COLS + x) * 4;
      let l = (0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]) / 255;
      l = Math.min(1, Math.max(0, l + bayer[(y % 4) * 4 + (x % 4)] / ramp.length));
      const c = ramp[Math.min(ramp.length - 1, Math.floor(l * ramp.length))];
      if (c === ' ') continue;
      o.fillStyle = l > 0.93 ? '#f2c14e' : '#e8e3d6';
      o.fillText(c, x * cw, y * ch);
    }
  }
  window.asciiRender = render;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  let raf = 0;
  const loop = (now) => { render(now); raf = requestAnimationFrame(loop); };
  const start = () => { cancelAnimationFrame(raf); if (reduce.matches) render(1200); else raf = requestAnimationFrame(loop); };
  // pause when off screen so the effect never runs unseen
  new IntersectionObserver(([e]) => { if (e.isIntersecting) start(); else cancelAnimationFrame(raf); }).observe(out);
  document.querySelectorAll('[data-set]').forEach((b) => b.addEventListener('click', () => {
    ramp = b.dataset.set; document.querySelectorAll('[data-set]').forEach((x) => x.setAttribute('aria-pressed', x === b)); if (reduce.matches) render(1200);
  }));
  start();
})();
</script>
</body>
</html>
